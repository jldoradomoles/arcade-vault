<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice">
<defs>
  <filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- Background -->
<rect width="160" height="100" fill="#060e04"/>
<!-- Safe zones: grass strips -->
<rect x="0" y="0" width="160" height="9" fill="#0d2209"/>
<rect x="0" y="50" width="160" height="8" fill="#0d2209"/>
<rect x="0" y="90" width="160" height="10" fill="#0d2209"/>
<!-- River -->
<rect x="0" y="9" width="160" height="41" fill="#030b1a"/>
<!-- Road -->
<rect x="0" y="58" width="160" height="32" fill="#141414"/>
<!-- Lane dashes -->
<g stroke="#2a2a2a" stroke-width=".6" stroke-dasharray="8,6">
  <line x1="0" y1="68" x2="160" y2="68"/>
  <line x1="0" y1="78" x2="160" y2="78"/>
</g>
<!-- Logs row 1 -->
<g filter="url(#g)">
  <rect x="4"   y="11" width="30" height="7" rx="3" fill="#5c3200" opacity=".85"/>
  <rect x="55"  y="11" width="26" height="7" rx="3" fill="#6a3a00" opacity=".85"/>
  <rect x="100" y="11" width="34" height="7" rx="3" fill="#5c3200" opacity=".85"/>
</g>
<!-- Logs row 2 -->
<g filter="url(#g)">
  <rect x="15"  y="23" width="34" height="7" rx="3" fill="#6a3a00" opacity=".8"/>
  <rect x="70"  y="23" width="28" height="7" rx="3" fill="#5c3200" opacity=".8"/>
  <rect x="112" y="23" width="36" height="7" rx="3" fill="#6a3a00" opacity=".8"/>
</g>
<!-- Logs row 3 -->
<g filter="url(#g)">
  <rect x="6"   y="35" width="28" height="7" rx="3" fill="#5c3200" opacity=".75"/>
  <rect x="52"  y="35" width="36" height="7" rx="3" fill="#6a3a00" opacity=".75"/>
  <rect x="108" y="35" width="32" height="7" rx="3" fill="#5c3200" opacity=".75"/>
</g>
<!-- Turtle hints (circles on log row 1) -->
<g filter="url(#g)" opacity=".7">
  <circle cx="12"  cy="14.5" r="3" fill="#22aa55"/>
  <circle cx="20"  cy="14.5" r="3" fill="#22aa55"/>
  <circle cx="28"  cy="14.5" r="3" fill="#22aa55"/>
</g>
<!-- Cars row 1 -->
<g filter="url(#g)">
  <rect x="18"  y="59" width="20" height="8" rx="2" fill="#ff3030" opacity=".9"/>
  <rect x="72"  y="59" width="20" height="8" rx="2" fill="#ff6600" opacity=".9"/>
  <rect x="128" y="59" width="20" height="8" rx="2" fill="#ff3030" opacity=".9"/>
  <!-- headlights -->
  <circle cx="38"  cy="63" r="1.3" fill="#ffe070"/>
  <circle cx="92"  cy="63" r="1.3" fill="#ffe070"/>
  <circle cx="148" cy="63" r="1.3" fill="#ffe070"/>
</g>
<!-- Cars row 2 -->
<g filter="url(#g)">
  <rect x="8"   y="69" width="18" height="8" rx="2" fill="#6699ff" opacity=".85"/>
  <rect x="60"  y="69" width="22" height="8" rx="2" fill="#ff44bb" opacity=".85"/>
  <rect x="115" y="69" width="18" height="8" rx="2" fill="#6699ff" opacity=".85"/>
</g>
<!-- Cars row 3 -->
<g filter="url(#g)">
  <rect x="30"  y="79" width="20" height="8" rx="2" fill="#ff6600" opacity=".85"/>
  <rect x="92"  y="79" width="24" height="8" rx="2" fill="#ff3030" opacity=".85"/>
</g>
<!-- Frog on middle safe zone -->
<g filter="url(#g)" transform="translate(72,50)">
  <!-- Body -->
  <ellipse cx="8" cy="5" rx="7" ry="5" fill="#22dd44"/>
  <!-- Head bumps / eyes -->
  <circle cx="3.5" cy="1.5" r="2.5" fill="#2eff55"/>
  <circle cx="12.5" cy="1.5" r="2.5" fill="#2eff55"/>
  <circle cx="3.5" cy="1.5" r="1.1" fill="#001a00"/>
  <circle cx="12.5" cy="1.5" r="1.1" fill="#001a00"/>
  <!-- Front legs -->
  <path d="M2 6 L-2 9" stroke="#22dd44" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M14 6 L18 9" stroke="#22dd44" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <!-- Back legs -->
  <path d="M3 9 L-1 13" stroke="#22dd44" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M13 9 L17 13" stroke="#22dd44" stroke-width="1.6" stroke-linecap="round" fill="none"/>
</g>
<!-- Subtle grid overlay on grass zones -->
<g stroke="#00ff44" stroke-opacity=".05" stroke-width=".4">
  <path d="M0 3H160"/><path d="M0 6H160"/>
  <path d="M0 53H160"/><path d="M0 56H160"/>
  <path d="M0 93H160"/><path d="M0 96H160"/>
</g>
</svg>
