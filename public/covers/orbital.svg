<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice">
<defs>
  <filter id="glo" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- Fondo -->
<rect width="160" height="100" fill="#0d0310"/>
<!-- Estrellas de fondo -->
<circle cx="14" cy="8" r=".8" fill="#ffffff" opacity=".6"/>
<circle cx="42" cy="15" r=".6" fill="#ffffff" opacity=".5"/>
<circle cx="130" cy="7" r=".9" fill="#ffffff" opacity=".65"/>
<circle cx="152" cy="28" r=".6" fill="#ffffff" opacity=".45"/>
<circle cx="8"  cy="62" r=".7" fill="#ffffff" opacity=".5"/>
<circle cx="155" cy="80" r=".8" fill="#ffffff" opacity=".6"/>
<circle cx="18"  cy="90" r=".6" fill="#ffffff" opacity=".4"/>
<circle cx="140" cy="92" r=".7" fill="#ffffff" opacity=".55"/>
<!-- Trayectorias de bolas hostiles (punteadas) -->
<line x1="22" y1="12" x2="70" y2="45" stroke="#8880cc" stroke-width=".6" stroke-dasharray="2,3" opacity=".35"/>
<line x1="148" y1="70" x2="92" y2="53" stroke="#8880cc" stroke-width=".6" stroke-dasharray="2,3" opacity=".35"/>
<line x1="58" y1="95" x2="77" y2="59" stroke="#8880cc" stroke-width=".6" stroke-dasharray="2,3" opacity=".35"/>
<!-- Anillo de pulso recargado (completo, brillante) -->
<circle cx="80" cy="50" r="36" fill="none" stroke="#ff006e" stroke-width="1.5" opacity=".4" filter="url(#glo)"/>
<!-- Bolas hostiles (blanco-azulado) -->
<circle cx="22" cy="12" r="4" fill="#c8d0ff" filter="url(#g)"/>
<circle cx="148" cy="70" r="4" fill="#c8d0ff" filter="url(#g)"/>
<circle cx="58"  cy="95" r="4" fill="#c8d0ff" filter="url(#g)"/>
<!-- Bola devuelta (rosa claro, dirigiéndose hacia la hostil de arriba-izquierda) -->
<circle cx="46" cy="24" r="4" fill="#ff88cc" filter="url(#g)"/>
<!-- Trayectoria de la bola devuelta -->
<line x1="60" y1="44" x2="46" y2="24" stroke="#ff88cc" stroke-width=".8" stroke-dasharray="2,2" opacity=".55"/>
<!-- Explosión (bola devuelta alcanzó a bola hostil) arriba-derecha -->
<circle cx="118" cy="14" r="9" fill="#ff7830" opacity=".12" filter="url(#glo)"/>
<circle cx="118" cy="14" r="5"   fill="#ffaa44" opacity=".45" filter="url(#g)"/>
<circle cx="118" cy="14" r="2.5" fill="#fff8aa" opacity=".85" filter="url(#g)"/>
<!-- Combo label -->
<text x="105" y="28" font-family="monospace" font-size="6" fill="#ff88cc" opacity=".8" filter="url(#glo)">×4</text>
<!-- Escudo en arco (radio≈20, apuntando a ~320°, arco de 50°) -->
<!-- start: 295°→ (87.8,31.2)   end: 345°→ (99.3,44.8) -->
<path d="M 88.4 31.1 A 20 20 0 0 1 99.3 44.8" fill="none" stroke="#ff4d9a" stroke-width="4" stroke-linecap="round" filter="url(#glo)"/>
<!-- Núcleo central -->
<circle cx="80" cy="50" r="8" fill="#2a0a2e"/>
<circle cx="80" cy="50" r="8" fill="#ff006e" opacity=".75" filter="url(#glo)"/>
<circle cx="80" cy="50" r="4.5" fill="#ff4db3" opacity=".9" filter="url(#g)"/>
</svg>
