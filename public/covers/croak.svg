<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice">
<defs>
  <filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glo" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- Background: swamp night -->
<rect width="160" height="100" fill="#061206"/>
<!-- Water -->
<rect x="0" y="58" width="160" height="42" fill="#040d08"/>
<!-- Water shimmer lines -->
<g stroke="#00f5ff" stroke-opacity=".05" stroke-width=".5">
  <line x1="0" y1="64" x2="160" y2="64"/>
  <line x1="0" y1="72" x2="160" y2="72"/>
  <line x1="0" y1="80" x2="160" y2="80"/>
  <line x1="0" y1="88" x2="160" y2="88"/>
  <line x1="0" y1="96" x2="160" y2="96"/>
</g>
<!-- Lily pads (5, arc at bottom) -->
<g filter="url(#g)">
  <ellipse cx="18"  cy="84" rx="13" ry="5.5" fill="#1a5c1a" opacity=".9"/>
  <path d="M18 78 L18 84" stroke="#0d3d0d" stroke-width=".8" fill="none"/>
  <ellipse cx="50"  cy="88" rx="13" ry="5.5" fill="#1e6a1e" opacity=".9"/>
  <path d="M50 82 L50 88" stroke="#0d3d0d" stroke-width=".8" fill="none"/>
  <ellipse cx="80"  cy="90" rx="15" ry="6.5" fill="#228822" opacity=".95"/>
  <path d="M80 83 L80 90" stroke="#0d3d0d" stroke-width=".8" fill="none"/>
  <ellipse cx="111" cy="88" rx="13" ry="5.5" fill="#1e6a1e" opacity=".9"/>
  <path d="M111 82 L111 88" stroke="#0d3d0d" stroke-width=".8" fill="none"/>
  <ellipse cx="143" cy="84" rx="13" ry="5.5" fill="#1a5c1a" opacity=".9"/>
  <path d="M143 78 L143 84" stroke="#0d3d0d" stroke-width=".8" fill="none"/>
</g>
<!-- Frog on center pad -->
<g filter="url(#g)" transform="translate(72,77)">
  <ellipse cx="8" cy="6" rx="7" ry="5" fill="#22dd44"/>
  <circle cx="3.5" cy="2" r="2.5" fill="#2eff55"/>
  <circle cx="12.5" cy="2" r="2.5" fill="#2eff55"/>
  <circle cx="3.5" cy="2" r="1.1" fill="#001a00"/>
  <circle cx="12.5" cy="2" r="1.1" fill="#001a00"/>
  <path d="M2 8 L-2 11" stroke="#22dd44" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M14 8 L18 11" stroke="#22dd44" stroke-width="1.6" stroke-linecap="round" fill="none"/>
</g>
<!-- Tongue extending toward fly -->
<line x1="80" y1="79" x2="108" y2="43" stroke="#ff88aa" stroke-width="1.4" opacity=".85"/>
<!-- Aim guide (dotted) -->
<line x1="80" y1="79" x2="125" y2="18" stroke="#00f5ff" stroke-width=".5" stroke-dasharray="2,3" opacity=".35"/>
<!-- Fly (target) -->
<g filter="url(#g)" transform="translate(106,41)">
  <ellipse cx="2" cy="2" rx="2.5" ry="2" fill="#888"/>
  <line x1="-4" y1="-1" x2="0" y2="2" stroke="#aaa" stroke-width=".8"/>
  <line x1="8" y1="-1" x2="4" y2="2" stroke="#aaa" stroke-width=".8"/>
</g>
<!-- Dragonfly -->
<g filter="url(#g)" transform="translate(38,28)">
  <ellipse cx="2" cy="3" rx="1.5" ry="3" fill="#44aaff"/>
  <line x1="-6" y1="0" x2="1" y2="2" stroke="#88ccff" stroke-width=".7" opacity=".8"/>
  <line x1="10" y1="0" x2="3" y2="2" stroke="#88ccff" stroke-width=".7" opacity=".8"/>
  <line x1="-5" y1="3" x2="1" y2="3" stroke="#88ccff" stroke-width=".6" opacity=".6"/>
  <line x1="9" y1="3" x2="3" y2="3" stroke="#88ccff" stroke-width=".6" opacity=".6"/>
</g>
<!-- Fireflies (cyan glowing) -->
<g filter="url(#glo)">
  <circle cx="128" cy="24" r="2.5" fill="#00f5ff" opacity=".9"/>
  <circle cx="128" cy="24" r="5" fill="#00f5ff" opacity=".25"/>
</g>
<g filter="url(#glo)">
  <circle cx="22" cy="18" r="2" fill="#00f5ff" opacity=".85"/>
  <circle cx="22" cy="18" r="4" fill="#00f5ff" opacity=".2"/>
</g>
<g filter="url(#glo)">
  <circle cx="150" cy="48" r="1.8" fill="#ffe070" opacity=".8"/>
  <circle cx="150" cy="48" r="3.5" fill="#ffe070" opacity=".18"/>
</g>
<!-- Combo x3 label -->
<text x="57" y="70" font-family="monospace" font-size="6.5" fill="#00f5ff" opacity=".65" filter="url(#glo)">x3</text>
</svg>
